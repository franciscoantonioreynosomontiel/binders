<!DOCTYPE html>    
<html lang="es">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Panel de Administración - TCG Dual</title>    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>    
<body>    
    <!-- Login Modal -->
    <div id="login-modal" class="overlay active">
        <div class="overlay-content login-container">
            <h1>Iniciar Sesión</h1>
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="login-username" placeholder="Tu nombre de usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="********">
            </div>
            <div id="register-fields" style="display: none; width: 100%;">
                <div class="form-group">
                    <label>Nombre de tu Tienda</label>
                    <input type="text" id="login-store" placeholder="Mi Tienda TCG">
                </div>
            </div>
            <button id="btn-login" class="btn" style="width: 100%; margin-bottom: 15px;">Entrar</button>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="btn-show-register" class="btn btn-secondary" style="flex: 1;">Registrarse</button>
                <button id="btn-register" class="btn btn-secondary" style="display: none; flex: 1; background: #27ae60;">Crear Cuenta</button>
            </div>
            <button id="btn-back-to-login" class="btn btn-secondary" style="display: none; width: 100%; margin-top: 10px;">Volver al Login</button>
        </div>
    </div>

    <!-- Authenticated Content -->
    <div id="authenticated-content" style="display: none; width: 100%;">
        <div class="admin-nav">
            <a href="index.html" class="btn btn-secondary"><i class="fas fa-eye"></i> Volver al Visor</a>
            <button id="btn-dashboard" class="btn"><i class="fas fa-book"></i> Mis Álbumes</button>
            <a href="users.html" id="btn-users-panel" class="btn" style="display: none;"><i class="fas fa-users-cog"></i> Panel de Usuarios</a>
            <button id="btn-logout" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        </div>

        <!-- Dashboard View -->
        <div id="view-dashboard" class="admin-section active">
            <div class="admin-header">
                <h1 id="welcome-message">Mis Álbumes</h1>
                <div id="store-link-container"></div>
                <button id="btn-create-album" class="btn"><i class="fas fa-plus"></i> Crear Nuevo Álbum</button>
            </div>
            <div id="album-list" class="album-list">
                <!-- Albums will be loaded here -->
                <div class="loading">Cargando álbumes...</div>
            </div>
        </div>

        <!-- Album Editor View -->
        <div id="view-editor" class="admin-section" style="display:none;">
            <div class="admin-header">
                <h1 id="editor-title">Editar Álbum</h1>
                <button id="btn-save-album-meta" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
            </div>

            <div class="album-card" style="max-width: 600px; margin: 0 auto 40px;">
                <div class="form-group">
                    <label>Título del Álbum</label>
                    <input type="text" id="input-album-title" placeholder="Nuevo Álbum">
                </div>
                <div class="form-group">
                    <label>URL Imagen de Portada</label>
                    <input type="text" id="input-album-cover" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>URL Imagen de Contraportada</label>
                    <input type="text" id="input-album-back" placeholder="https://...">
                </div>
            </div>

            <div class="admin-header">
                <h2><i class="fas fa-file-alt"></i> Páginas</h2>
                <button id="btn-add-page" class="btn"><i class="fas fa-plus-circle"></i> Añadir Página</button>
            </div>
            <div id="page-list" class="page-list-container">
                <!-- Pages will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Card Slot Modal -->
    <div id="slot-modal" class="overlay">
        <div class="overlay-content">
            <span id="close-slot-modal" class="close-btn">&times;</span>
            <h2>Editar Espacio</h2>
            <div class="form-group">
                <label>URL de la Imagen</label>
                <input type="text" id="slot-image-url">
            </div>
            <div class="form-group">
                <label>Nombre de la Carta</label>
                <input type="text" id="slot-name">
            </div>
            <div class="info-grid">
                <div class="form-group">
                    <label>Rareza</label>
                    <input type="text" id="slot-rarity">
                </div>
                <div class="form-group">
                    <label>Expansión</label>
                    <input type="text" id="slot-expansion">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <input type="text" id="slot-condition">
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="text" id="slot-quantity">
                </div>
                <div class="form-group price-item">
                    <label>Precio</label>
                    <input type="text" id="slot-price">
                </div>
            </div>
            <button id="btn-save-slot" class="btn" style="width: 100%; margin-top: 20px;"><i class="fas fa-check-circle"></i> Guardar Carta</button>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>    
</html>
