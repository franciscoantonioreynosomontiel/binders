<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Turn.js Fluidity</title>
    <link rel="stylesheet" href="css/testFlip.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        .page {
            background: #1a1a1a !important;
            padding: 12px !important;
        }
        .cover-page {
            padding: 0 !important;
        }
        .cover-page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="flipbook-viewport">
    <div class="container">
        <div class="flipbook">
            <!-- Portada -->
            <div class="page cover-page">
                <img src="https://via.placeholder.com/600x840?text=Portada" alt="Cover">
            </div>

            <!-- Página 1 con Grid -->
            <div class="page">
                <div class="grid-container">
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+1" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+2" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+3" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+4" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+5" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+6" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+7" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+8" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+9" class="tcg-card"></div>
                </div>
            </div>

            <!-- Página 2 con Grid -->
            <div class="page">
                <div class="grid-container">
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+10" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+11" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+12" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+13" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+14" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+15" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+16" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+17" class="tcg-card"></div>
                    <div class="card-slot"><img src="https://via.placeholder.com/200x280?text=Card+18" class="tcg-card"></div>
                </div>
            </div>

            <!-- Contraportada -->
            <div class="page cover-page">
                <img src="https://via.placeholder.com/600x840?text=Contraportada" alt="Back Cover">
            </div>
        </div>
    </div>
</div>

<script src="js/testTurn.js"></script>
<script>
    $(document).ready(function() {
        $('.flipbook').turn({
            width: 922,
            height: 700,
            autoCenter: true,
            gradients: true,
            acceleration: true,
            duration: 1000
        });
    });
</script>

</body>
</html>
