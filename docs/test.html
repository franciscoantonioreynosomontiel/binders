<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Rarezas Test - TCG Dual</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/test.css">
    <style>
        /* Ajuste para z-text */
        .z-layer {
            border-radius: 15px;
        }
    </style>
</head>
<body class="public-body">

    <h1 style="color: white; text-align: center; margin-top: 30px; font-family: sans-serif;">Simulación de Rarezas TCG</h1>

    <div class="test-container">

        <!-- SUPER RARE -->
        <div class="card-item">
            <div class="card-wrapper super-rare">
                <div class="card-3d z-text">
                    <img class="card-image" src="https://images.pokemontcg.io/swsh1/79_hires.png" alt="Mewtwo V">
                    <div class="holo-layer"></div>
                </div>
            </div>
            <div class="card-label">Super Rare (Foil Fondo)</div>
        </div>

        <!-- FOIL -->
        <div class="card-item">
            <div class="card-wrapper foil">
                <div class="card-3d z-text">
                    <img class="card-image" src="https://images.pokemontcg.io/swsh4/188_hires.png" alt="Pikachu VMAX">
                    <div class="holo-layer"></div>
                </div>
            </div>
            <div class="card-label">Foil (Brillo Holograma)</div>
        </div>

        <!-- GHOST RARE -->
        <div class="card-item">
            <div class="card-wrapper ghost-rare">
                <div class="card-3d z-text">
                    <img class="card-image" src="https://images.pokemontcg.io/neo1/9_hires.png" alt="Lugia">
                    <div class="holo-layer"></div>
                </div>
            </div>
            <div class="card-label">Ghost Rare (Efecto Blanco)</div>
        </div>

        <!-- SECRET RARE -->
        <div class="card-item">
            <div class="card-wrapper secret-rare">
                <div class="card-3d z-text">
                    <img class="card-image" src="https://images.pokemontcg.io/swsh4/185_hires.png" alt="Pikachu VMAX Secret">
                    <div class="holo-layer"></div>
                </div>
            </div>
            <div class="card-label">Secret Rare (Glitter / Textura)</div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/ztext.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
