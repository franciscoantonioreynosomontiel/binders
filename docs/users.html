<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuarios - TCG Dual</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="public-body">
    <div class="admin-nav">
        <a href="admin.html" class="btn btn-secondary">Volver al Admin</a>
        <button id="btn-logout" class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="admin-section active">
        <div class="admin-header">
            <h1>Gestión de Usuarios y Contraseñas</h1>
        </div>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Nombre de Usuario</th>
                    <th>Contraseña</th>
                    <th>Nombre de Tienda</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="user-list-body">
                <!-- Users will be loaded here -->
                <tr><td colspan="5" class="loading">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        $(document).ready(async function() {
            // Check session
            const sessionData = localStorage.getItem('tcg_session');
            if (!sessionData) {
                window.location.href = 'admin.html';
                return;
            }

            const currentUser = JSON.parse(sessionData);
            if (currentUser.role !== 'admin') {
                alert('Acceso restringido solo para administradores.');
                window.location.href = 'admin.html';
                return;
            }

            const { data: users, error } = await _supabase
                .from('usuarios')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                $('#user-list-body').html('<tr><td colspan="5" class="error">Error al cargar usuarios.</td></tr>');
                return;
            }

            $('#user-list-body').empty();
            users.forEach(user => {
                const $row = $(`
                    <tr data-id="${user.id}">
                        <td>${user.username}</td>
                        <td>${user.password}</td>
                        <td>${user.store_name || '-'}</td>
                        <td>
                            <select class="role-select" data-id="${user.id}" style="background: #252525; color: white; border: 1px solid #3d3d3d; padding: 5px; border-radius: 4px;">
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>Usuario</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm btn-delete-user" data-id="${user.id}"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `);
                $('#user-list-body').append($row);
            });

            // Role Change Event
            $(document).on('change', '.role-select', async function() {
                const userId = $(this).data('id');
                const newRole = $(this).val();

                const { error } = await _supabase
                    .from('usuarios')
                    .update({ role: newRole })
                    .eq('id', userId);

                if (error) {
                    alert('Error al actualizar rol');
                    console.error(error);
                } else {
                    // Update current session if changed own role
                    if (userId === currentUser.id) {
                        currentUser.role = newRole;
                        localStorage.setItem('tcg_session', JSON.stringify(currentUser));
                    }
                    alert('Rol actualizado con éxito');
                }
            });

            // Delete User Event
            $(document).on('click', '.btn-delete-user', async function() {
                const userId = $(this).data('id');
                if (userId === currentUser.id) {
                    alert('No puedes eliminarte a ti mismo.');
                    return;
                }

                if (confirm('¿Estás seguro de eliminar este usuario? Sus álbumes también se eliminarán.')) {
                    const { error } = await _supabase
                        .from('usuarios')
                        .delete()
                        .eq('id', userId);

                    if (error) {
                        alert('Error al eliminar usuario');
                        console.error(error);
                    } else {
                        $(`tr[data-id="${userId}"]`).remove();
                        alert('Usuario eliminado');
                    }
                }
            });

            $('#btn-logout').click(function() {
                localStorage.removeItem('tcg_session');
                window.location.href = 'admin.html';
            });
        });
    </script>
</body>
</html>
